apiVersion: apps/v1
kind: Deployment
metadata:
  name: medrec-extract
  labels: {app: medrec-extract}
spec:
  replicas: 2
  selector:
    matchLabels: {app: medrec-extract}
  template:
    metadata:
      labels: {app: medrec-extract}
    spec:
      securityContext: {runAsNonRoot: true, runAsUser: 10001}
      containers:
        - name: api
          image: medrec-extract:ci
          imagePullPolicy: IfNotPresent
          ports: [{containerPort: 8000}]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: medrec-extract
spec:
  selector: {app: medrec-extract}
  ports: [{port: 80, targetPort: 8000}]
